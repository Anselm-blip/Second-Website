<!DOCTYPE html>
<html>
    <head>
        <title>You Forgot</title>
    </head>

    <body>
        <label for="forgot">Forgot Password? Please enter your email below and you will receive a special thing</label><br><br>

        <label for="forgot">Email:</label>
        <input type="email" id="forgot" name="forgot" required>
        <input type="submit" value="Send Code">

        <br><br>
    <div>
        <label for="Code">Verification Code:</label>
        <input type="text" id="Code" name="Code" minlength="6" maxlength="6" required><br><br>
    </div>

    <div>
        <input type="submit" value="Verify Code"><br><br>    
        <label for="newpassword">New Password:</label>  
        <input type="password" id="newpassword" name="newpassword" minlength="6" maxlength="6" required><br><br>
    </div>
    
    <div>
        <a href="Login.html">
            <input type="submit" value="Confirm password"
        </a>
    
    </div>

    </body>



</html>
