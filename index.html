<!DOCTYPE html>
<html>
<head>  
    <title>Sign ups for some good Time with me!</title>
</head>
<body>
    <h1>Sign UP Form</h1>
    <p>
    this will determine whether you are 
    fit to be with me or not
    </p>
<hr>
    <div>
    <form action="success.html" method="get">
        
        <div class="form-group">
            <label for="fname">First Name</label>
            <input type="text" Id="fname" name="fname" placeholder="Chicken "></input>
        </div>

        <div class="form-group">
            <label for="lname">Last Name</label>
            <input type="text" Id="lname" name="lname" placeholder="Jockey"></input>
        </div>

        <div class="form-group">
            <label for="age">Age</label>
            <input type="text" Id="age" name="age" min="0" max="100"></input>
        </div>

        <div class="form-group">
            <label for="height">Height (cm)</label>
            <input type="number" Id="height" name="height" min="0" max="300" placeholder="189.9"></input>
        </div>

        <div class="form-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" Id="weight" name="weight" min="0" max="300" placeholder="68.4"></input>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" Id="email" name="email" placeholder="chiecken@gmail.com"></input>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" Id="password" name="password" minlength="6" maxlength="20"></input>
        </div>

        <div class="form-group">
            <label for="password_repeat">Confirm Password</label>
            <input type="password" Id="password_repeat" name="password_repeat" minlength="6" maxlength="20"></input>
        </div>

        <div class="form-group">
            <label for="Phone">Phone Number</label>
            <input type="tel" Id="Phone" name="Phone" pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}" placeholder="1234-123-1234"></input>
        </div>

        <div class="form-group">
            <label for="title">Title:</label>
            <input type="radio" Id="Title" name="title" value="Mr" > Mr
            <input type="radio" Id="Title" name="title" value="Mrs" > Mrs
            <input type="radio" Id="Title" name="title" value="Ms" > Ms
        </div>

         <button type="submit">Submit</button>   
            
         <p>Already have an Account? Click <a href="Login.html">Login</a></p>

        </div>

    </form>

    </div>
</body>
</html>
